<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>经营分析工作台</title>
<meta name="description" content="北极星测算、期次排班与经营分析工具的统一入口。">
<link rel="icon" href="data:,">
<style>
:root{--ink:#1c2e49;--muted:#69778b;--line:#e0e7ef;--blue:#315dc6;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{height:76px;border-bottom:1px solid var(--line);background:#fff}.bar,main,footer{max-width:1120px;margin:auto;padding:0 32px}.bar{display:flex;align-items:center;justify-content:space-between;height:100%}.brand{font-size:17px;font-weight:700;letter-spacing:.4px}.domain{color:var(--muted);font-size:12px}main{padding-top:54px;min-height:calc(100vh - 148px)}h1{font-size:30px;line-height:1.35;margin:0 0 12px;letter-spacing:-.5px}.intro{margin:0;color:var(--muted);font-size:15px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:34px 0 20px}.filters{display:flex;gap:8px}.filters button{border:1px solid transparent;padding:8px 14px;border-radius:7px;background:transparent;color:var(--muted);font:inherit;cursor:pointer}.filters button[aria-pressed="true"]{background:#eaf0ff;color:var(--blue);border-color:#d6e1ff}.search{width:290px;border:1px solid #d3dce9;border-radius:8px;padding:10px 12px;font:inherit;background:#fff}.search:focus{outline:2px solid #c6d5f9;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{display:flex;flex-direction:column;min-height:232px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s}.card:hover{border-color:#a9bfe9;box-shadow:0 8px 25px #18355b0b}.card:focus-visible{outline:3px solid #aac1f5;outline-offset:3px}.category{font-size:12px;color:var(--muted);margin-bottom:15px}.card h2{font-size:20px;line-height:1.5;margin:0 0 10px}.card p{margin:0 0 24px;color:var(--muted)}.open{margin-top:auto;color:var(--blue);font-size:13px;font-weight:600}.empty{grid-column:1/-1;padding:38px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}footer{padding-top:34px;padding-bottom:22px;font-size:12px;color:var(--muted)}@media(max-width:700px){.bar,main,footer{padding-left:20px;padding-right:20px}main{padding-top:32px}h1{font-size:25px}.grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.domain{display:none}}
</style>
<style>.section-heading{grid-column:1/-1;font-size:17px;margin:16px 0 -6px;color:#344969}.section-heading:first-child{margin-top:0}</style>
</head>
<body>
<header><div class="bar"><span class="brand">经营分析工作台</span><span class="domain">chichizi.top</span></div></header>
<main><h1>把分析与决策，放在同一个入口。</h1><p class="intro">选择工具开始测算，也可以直接收藏对应页面。</p>
<div class="toolbar"><div class="filters" id="filters" aria-label="筛选类型"></div><input class="search" id="search" type="search" placeholder="搜索工具名称或用途" aria-label="搜索工具"></div>
<div class="grid" id="links" aria-live="polite"></div><noscript><p><a href="beia/">北极星A经营决策系统</a> · <a href="legacy/">原版北极星计算器</a></p></noscript></main>
<footer>经营测算 · 期次排班 · 专项分析</footer>
<script src="links.js"></script>
<script>
let selected="全部";const catalog=window.WORKBENCH_LINKS||[],container=document.getElementById("links"),filters=document.getElementById("filters"),query=document.getElementById("search");
function render(){container.replaceChildren();const terms=query.value.trim().toLowerCase();const list=catalog.filter(x=>(selected==="全部"||x.category===selected)&&[x.title,x.description,x.category].join(" ").toLowerCase().includes(terms));let group="";for(const item of list){const target=new URL(item.href,location.href);if(!["http:","https:","file:"].includes(target.protocol))continue;if(group!==item.category){group=item.category;const heading=document.createElement("h2");heading.className="section-heading";heading.textContent=group;container.append(heading)}const a=document.createElement("a");a.className="card";a.href=item.href;const category=document.createElement("div");category.className="category";category.textContent=item.category;const title=document.createElement("h2");title.textContent=item.title;const desc=document.createElement("p");desc.textContent=item.description;const action=document.createElement("span");action.className="open";action.textContent=item.action||"打开工具 →";a.append(category,title,desc,action);container.append(a)}if(!container.children.length){const empty=document.createElement("p");empty.className="empty";empty.textContent="没有找到匹配的工具，请换个关键词。";container.append(empty)}}
for(const label of ["全部",...new Set(catalog.map(x=>x.category))]){const b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",String(label===selected));b.onclick=()=>{selected=label;for(const child of filters.children)child.setAttribute("aria-pressed",String(child===b));render()};filters.append(b)}query.oninput=render;render();
</script></body></html>
