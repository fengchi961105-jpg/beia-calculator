<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北极星 · 本期经营看板</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#17344a;background:#f3f8f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 10%,#d5ece8 0,transparent 36%),radial-gradient(circle at 95% 80%,#e7edf9 0,transparent 40%),#f3f8f8;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:#fff;border:1px solid #d7e4e8;border-radius:20px;box-shadow:0 24px 70px #163b4d17;padding:38px}.brand{display:flex;gap:11px;align-items:center;color:#0b766f;font-weight:700;letter-spacing:.12em;font-size:12px}.brand-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#0d847a,#2d607e);display:grid;place-items:center;color:white;letter-spacing:0}.eyebrow{color:#648092;font-size:12px;margin:30px 0 8px}h1{font-size:29px;line-height:1.32;letter-spacing:-.025em;margin:0;color:#153b50}p{font-size:14px;line-height:1.7;color:#6d8292;margin:12px 0 26px}.tag{display:inline-flex;background:#e8f4f1;color:#0b7068;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:650;margin-bottom:18px}label{font-size:13px;font-weight:650;display:block;margin-bottom:8px}input{width:100%;height:48px;border:1px solid #c9d9df;border-radius:10px;padding:0 14px;font:inherit;outline:none}input:focus{border-color:#13877c;box-shadow:0 0 0 3px #13877c1f}button{border:0;border-radius:10px;background:#0e786f;color:#fff;font:inherit;font-size:14px;font-weight:650;width:100%;height:48px;margin-top:14px;cursor:pointer}button:hover{background:#096a62}button:disabled{opacity:.6;cursor:wait}.error{min-height:21px;margin-top:12px;font-size:12px;color:#ad354b}.back{display:inline-block;margin-top:12px;text-decoration:none;color:#667e8d;font-size:12px}.back:hover{color:#0c706a}@media(max-width:550px){.card{padding:28px 22px}h1{font-size:25px}}
</style><style>.pw-row{position:relative}.pw-row input{padding-right:76px}.pw-toggle{position:absolute;top:4px;right:6px;width:62px;height:40px;margin:0;background:transparent;color:#42616c;font-size:12px}.pw-toggle:hover{background:#eef5f4}.reload{display:none;margin-top:8px;background:#e8f4f1;color:#0b7068}.reload:hover{background:#dcefeb}</style></head><body><main class="card"><div class="brand"><span class="brand-mark">北</span> 北极星 · 经营分析</div><div class="eyebrow">七渠道经营监控</div><h1>本期经营看板</h1><p>按商分数据分区查看经营实绩、子渠道与跨期趋势。</p><div class="tag">最近三个数据分区 · 默认最新</div><form id="gate"><label for="password">访问密码</label><div class="pw-row"><input id="password" type="password" autocomplete="current-password" required placeholder="输入密码查看看板"><button type="button" id="toggle" class="pw-toggle" aria-label="显示密码">显示</button></div><button type="submit" id="submit">进入看板</button><div class="error" id="error" role="status" aria-live="polite"></div><button type="button" id="reload" class="reload">刷新入口后重试</button></form><a class="back" href="../">← 返回经营分析工作台</a></main><script>
const manifest={"salt":"/Y6qjrtNNz1/iR7wqZv6+w==","rounds":310000,"snapshotName":"snapshot.ebb0f7fa11586495c891ae6dba82cdeb927ddb56eba2c502a85f3fe0febbb1e2.json","app":{"file":"app.6ba4b77540b71dc6.bin","iv":"snUWERreeFH9Oh47"},"data":{"file":"snapshot.de6c8f4b842c8fb5.bin","iv":"kF6sv1YYlL73ZV97"}};
const sessionKey='northstar_dashboard_key_v1';
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function decrypt(item,key){let response;for(let attempt=0;attempt<2;attempt++){try{response=await fetch(item.file+(attempt?'?retry='+Date.now():''),{cache:'no-store'});if(response.ok)break}catch{}}if(!response?.ok)throw Error('resource');const bytes=await response.arrayBuffer();let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(item.iv)},key,bytes)}catch{throw Error('password')}const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).arrayBuffer();}
async function openWith(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const [appBytes,dataBytes]=await Promise.all([decrypt(manifest.app,key),decrypt(manifest.data,key)]);const url=URL.createObjectURL(new Blob([dataBytes],{type:'application/json'}));let html=new TextDecoder().decode(appBytes);const marker='content="'+manifest.snapshotName+'"';if(!html.includes(marker))throw Error('看板资源版本不匹配');html=html.replace(marker,'content="'+url+'"');html=html.replace('</head>','<style>.dashboard-header-edit-button,.dashboard-publish-button,.dashboard-ask-button,.dashboard-header-overflow-button,.theme-drawer{display:none!important}</style></head>');window.__northstarDataUrl=url;document.open();document.write(html);document.close();}
async function enter(password){const basis=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.trim()),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(manifest.salt),iterations:manifest.rounds,hash:'SHA-256'},basis,256);await openWith(bits);sessionStorage.setItem(sessionKey,JSON.stringify({key:btoa(String.fromCharCode(...new Uint8Array(bits))),expires:Date.now()+8*60*60*1000}));}
const form=document.getElementById('gate'),button=document.getElementById('submit'),error=document.getElementById('error'),reload=document.getElementById('reload'),input=document.getElementById('password'),toggle=document.getElementById('toggle');toggle.addEventListener('click',()=>{input.type=input.type==='password'?'text':'password';toggle.textContent=input.type==='password'?'显示':'隐藏';toggle.setAttribute('aria-label',input.type==='password'?'显示密码':'隐藏密码')});reload.addEventListener('click',()=>{location.href='index.html?refresh='+Date.now()});form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='正在解锁…';error.textContent='正在读取加密数据，首次打开可能需要几十秒。';error.style.color='#6d8292';reload.style.display='none';try{await enter(input.value)}catch(err){error.style.color='#ad354b';error.textContent=err.message==='password'?'密码不正确，请检查大小写；复制粘贴时首尾空格会自动忽略。':'看板资源加载失败，请刷新入口后重试。';reload.style.display=err.message==='password'?'none':'block';button.disabled=false;button.textContent='进入看板';sessionStorage.removeItem(sessionKey)}});
try{const saved=JSON.parse(sessionStorage.getItem(sessionKey)||'null');if(saved&&saved.expires>Date.now())openWith(b64(saved.key)).catch(()=>sessionStorage.removeItem(sessionKey))}catch{sessionStorage.removeItem(sessionKey)}
</script></body></html>
