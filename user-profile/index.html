<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户画像分析 · 经营监控</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#344c3d;font:14px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.gate{width:min(460px,100%);background:white;border:1px solid #dfe8e1;border-radius:12px;padding:36px}small{color:#81948a}h1{font-size:27px;font-weight:600;margin:15px 0 10px}p{font-size:13px;color:#7b8e82}label{display:block;margin-top:28px;font-size:12px}input{width:100%;height:44px;margin:8px 0 12px;border:1px solid #ceded3;border-radius:6px;padding:0 12px;font:inherit}button{width:100%;height:43px;background:#39714e;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{display:inline-block;margin-top:16px;font-size:12px;text-decoration:none;color:#76907e}.password-field{position:relative;margin:8px 0 12px}.password-field input{margin:0;padding-right:70px}.password-visibility{position:absolute;right:5px;top:4px;width:57px;height:36px;background:transparent;color:#587862;font-size:12px;border:0;cursor:pointer}.password-visibility:hover{background:#edf3ef}.remember{display:flex;align-items:center;gap:7px;margin:0 0 14px;font-size:12px;color:#6b8374}.remember input{width:14px;height:14px;margin:0;accent-color:#39714e}#error{min-height:20px;font-size:12px;color:#ad655c;margin-top:12px}</style></head><body><main class="gate"><small>经营监控 · 密码访问</small><h1>用户画像分析</h1><p>查看期次变化、渠道大类与业务分析。</p><form id="gate"><label for="password">访问密码</label><div class="password-field"><input type="password" id="password" autocomplete="current-password" required placeholder="输入访问密码"><button type="button" id="togglePassword" class="password-visibility" aria-label="显示密码" aria-pressed="false">显示</button></div><label class="remember"><input type="checkbox" id="remember" checked>记住此设备30天（画像与问题例子通用）</label><button id="enter">进入分析</button><div id="error" role="status"></div></form><a href="../">← 返回经营分析工作台</a></main><script>(()=>{
const M={"file":"bundle.00fb17aad6a70f10.bin","salt":"fi+hV8D3e4P7FdRL4B29qw==","iv":"JjoLlbdESufGdnK7","rounds":310000},ENTRY="index.html",LEGACY="chichizi_user-profile_access_v1",SK='chichizi_profile_quality_device_v2_'+M.salt;let remembered=false,rememberExpiry=0;
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open(raw){let bytes;for(let i=0;i<3;i++){try{let r=await fetch(M.file+(i?'?retry='+Date.now():''),{cache:'no-store'});if(!r.ok)throw Error('resource');bytes=await r.arrayBuffer();break}catch(e){if(i===2)throw Error('resource')}}const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);let decrypted;try{decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(M.iv)},key,bytes)}catch{throw Error('password')}let data=JSON.parse(await new Response(new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'))).text()),A=data.assets,originalFetch=window.fetch.bind(window);window.fetch=(input,init)=>{let name=new URL(typeof input==='string'?input:input.url,location.href).pathname.split('/').pop();return name in A?Promise.resolve(new Response(A[name],{headers:{'Content-Type':name.endsWith('.json')?'application/json':'text/plain'}})):originalFetch(input,init)};let html=A[ENTRY];html=html.replace(/<link\b[^>]*href="([^"]+)"[^>]*>/g,(tag,url)=>{let name=url.split('?')[0].split('/').pop();return A[name]?'<style>'+A[name]+'</style>':tag});html=html.replace(/<script\b[^>]*src="([^"]+)"[^>]*><\/script>/g,(tag,url)=>{let name=url.split('?')[0].split('/').pop();return A[name]?'<script>'+A[name].replace(/<\/script/gi,'<\\/script')+'<\/script>':tag});window.__reportAssets=A;html=html.replace('</head>','<style>.device-access{display:flex;justify-content:flex-end;align-items:center;gap:12px;font:11px system-ui;color:#8a9c8e;padding-top:9px}.device-access button{font:inherit;color:#658672;background:transparent;border:0;cursor:pointer;padding:0}</style></head>');document.open();document.write(html);document.close();const access=document.createElement('div');access.className='device-access';const label=document.createElement('span');label.textContent=remembered?'此设备已记住登录 · 画像与问题例子通用':'仅本次登录';const exit=document.createElement('button');exit.textContent='退出并忘记此设备';exit.onclick=()=>{for(const storage of [localStorage,sessionStorage]){try{storage.removeItem(SK);storage.removeItem('chichizi_user-profile_access_v1');storage.removeItem('chichizi_lead-quality_access_v1')}catch{}}location.reload()};access.append(label,exit);document.querySelector('.topnav')?.insertAdjacentElement('afterend',access);}
function storeAccess(raw,remember,expires){const value=JSON.stringify({raw:btoa(String.fromCharCode(...new Uint8Array(raw))),expires,salt:M.salt,version:2});try{(remember?localStorage:sessionStorage).setItem(SK,value);(remember?sessionStorage:localStorage).removeItem(SK)}catch{}}

const passwordInput=document.getElementById('password'),togglePassword=document.getElementById('togglePassword');togglePassword.addEventListener('click',()=>{const visible=passwordInput.type==='password',start=passwordInput.selectionStart,end=passwordInput.selectionEnd;passwordInput.type=visible?'text':'password';togglePassword.textContent=visible?'隐藏':'显示';togglePassword.setAttribute('aria-label',visible?'隐藏密码':'显示密码');togglePassword.setAttribute('aria-pressed',String(visible));passwordInput.focus({preventScroll:true});try{passwordInput.setSelectionRange(start,end)}catch{}});const form=document.getElementById('gate'),button=document.getElementById('enter'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;error.textContent='正在读取加密报告…';try{await enter(document.getElementById('password').value,document.getElementById('remember').checked)}catch(e){error.textContent=e.message==='password'?'密码不正确，请重新输入。':'资源加载失败，请刷新入口重试。';button.disabled=false;try{sessionStorage.removeItem(SK);localStorage.removeItem(SK)}catch{}}});
try{let saved=JSON.parse(localStorage.getItem(SK)||sessionStorage.getItem(SK)||'null'),legacy=false;if(!saved){saved=JSON.parse(sessionStorage.getItem(LEGACY)||'null');legacy=!!saved}if(saved&&saved.expires>Date.now()){remembered=legacy||!!localStorage.getItem(SK);rememberExpiry=legacy?Date.now()+30*24*3600000:saved.expires;open(b64(saved.raw)).then(()=>{if(legacy)storeAccess(b64(saved.raw),true,rememberExpiry)}).catch(()=>{try{sessionStorage.removeItem(SK);localStorage.removeItem(SK);sessionStorage.removeItem(LEGACY)}catch{}})}else{localStorage.removeItem(SK);sessionStorage.removeItem(SK)}}catch{}
