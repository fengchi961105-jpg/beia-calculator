<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户画像分析 · 经营监控</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#344c3d;font:14px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.gate{width:min(460px,100%);background:white;border:1px solid #dfe8e1;border-radius:12px;padding:36px}small{color:#81948a}h1{font-size:27px;font-weight:600;margin:15px 0 10px}p{font-size:13px;color:#7b8e82}label{display:block;margin-top:28px;font-size:12px}input{width:100%;height:44px;margin:8px 0 12px;border:1px solid #ceded3;border-radius:6px;padding:0 12px;font:inherit}button{width:100%;height:43px;background:#39714e;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{display:inline-block;margin-top:16px;font-size:12px;text-decoration:none;color:#76907e}#error{min-height:20px;font-size:12px;color:#ad655c;margin-top:12px}</style></head><body><main class="gate"><small>经营监控 · 密码访问</small><h1>用户画像分析</h1><p>查看期次变化、渠道大类与业务分析。</p><form id="gate"><label for="password">访问密码</label><input type="password" id="password" autocomplete="current-password" required placeholder="输入访问密码"><button id="enter">进入分析</button><div id="error" role="status"></div></form><a href="../">← 返回经营分析工作台</a></main><script>(()=>{
const M={"file":"bundle.46cf4d1cda512241.bin","salt":"fi+hV8D3e4P7FdRL4B29qw==","iv":"c9Ob5BNOm6Yt181v","rounds":310000},ENTRY="index.html",SK="chichizi_user-profile_access_v1";
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open(raw){let bytes;for(let i=0;i<3;i++){try{let r=await fetch(M.file+(i?'?retry='+Date.now():''),{cache:'no-store'});if(!r.ok)throw Error('resource');bytes=await r.arrayBuffer();break}catch(e){if(i===2)throw Error('resource')}}const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);let decrypted;try{decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(M.iv)},key,bytes)}catch{throw Error('password')}let data=JSON.parse(await new Response(new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'))).text()),A=data.assets,originalFetch=window.fetch.bind(window);window.fetch=(input,init)=>{let name=new URL(typeof input==='string'?input:input.url,location.href).pathname.split('/').pop();return name in A?Promise.resolve(new Response(A[name],{headers:{'Content-Type':name.endsWith('.json')?'application/json':'text/plain'}})):originalFetch(input,init)};let html=A[ENTRY];html=html.replace(/<link\b[^>]*href="([^"]+)"[^>]*>/g,(tag,url)=>{let name=url.split('?')[0].split('/').pop();return A[name]?'<style>'+A[name]+'</style>':tag});html=html.replace(/<script\b[^>]*src="([^"]+)"[^>]*><\/script>/g,(tag,url)=>{let name=url.split('?')[0].split('/').pop();return A[name]?'<script>'+A[name].replace(/<\/script/gi,'<\\/script')+'<\/script>':tag});window.__reportAssets=A;document.open();document.write(html);document.close();}
async function enter(password){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.trim()),'PBKDF2',false,['deriveBits']),raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(M.salt),iterations:M.rounds,hash:'SHA-256'},material,256);await open(raw);sessionStorage.setItem(SK,JSON.stringify({raw:btoa(String.fromCharCode(...new Uint8Array(raw))),expires:Date.now()+8*3600000}));}
const form=document.getElementById('gate'),button=document.getElementById('enter'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;error.textContent='正在读取加密报告…';try{await enter(document.getElementById('password').value)}catch(e){error.textContent=e.message==='password'?'密码不正确，请重新输入。':'资源加载失败，请刷新入口重试。';button.disabled=false;sessionStorage.removeItem(SK)}});try{let saved=JSON.parse(sessionStorage.getItem(SK)||'null');if(saved?.expires>Date.now())open(b64(saved.raw)).catch(()=>sessionStorage.removeItem(SK))}catch{sessionStorage.removeItem(SK)}
})();</script></body></html>
